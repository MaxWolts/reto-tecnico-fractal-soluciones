# Vercel installs runtime dependencies from here, not from requirements.txt.
# Keep both lists identical (tests/test_dependencies.py checks it).
[project]
name = "maintenance-tickets-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyMySQL==1.2.3",
    "cryptography==50.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a running MySQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.vercel]
entrypoint = "app.main:app"
